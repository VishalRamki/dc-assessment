{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<h2>Login</h2>

<form method="post">
  {% csrf_token %}
    {{ form|crispy }}
  {% if form.errors %}
    <p style="color:red;">Invalid username or password</p>
  {% endif %}

  <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
